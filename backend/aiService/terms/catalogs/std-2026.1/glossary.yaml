  note: 'ISO 20275 GLEIF ELF Code List v1.6(2026-02-19, https://www.gleif.org/en/about-lei/code-lists/iso-20275-entity-legal-forms-code-list) 대조. 구성요소 ''Co.''·''Ltd.''가 각각 미국/영국 등록에서 개별 확인되며, 쉼표 결합 표기(''Co., Ltd.'')는 실무에서 광범위하게 쓰이는 표준적 결합 방식이다(validators.py의 토큰 결합 규칙과 동일한 '', '' 결합 관례). catalog canonical과 일치.'
