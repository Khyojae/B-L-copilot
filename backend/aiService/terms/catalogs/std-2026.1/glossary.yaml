# --- container_no (CTR.*) ---
# 주의: 이 클래스는 policy 상 허용 단계가 pattern 뿐이라(terms/policy.py),
# 캐스케이드는 아래 항목을 조회하지 않는다. 교정은 ISO 6346 체크디지트
# 알고리즘과 자릿수 정규화가 전담한다. 아래 접두를 유지하는 이유:
#  (1) display 의 선사명을 제안 메시지에 덧붙이는 표시 용도
#  (2) 향후 alias 단계 개방 시 참조 자료
# 2026-08 감사: BIC 등록 실재를 확신하는 접두만 남김(40건 -> 13건).
  verified: true
  note: '미국 HTS(hts.usitc.gov) reststop API 실시간 조회로 6단위 국제 HS 조문 대조. 8521.90 = ''Other''(8521 영상기록·재생기기 중 잔여 구분) 확인 — display는 8521 표제(heading)를 그대로 썼다. 잔여(Other) 하위 성격까지는 명시하지 않았으나 오류는 아님.'
