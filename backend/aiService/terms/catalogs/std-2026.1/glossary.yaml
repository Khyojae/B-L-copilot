terms:
- term_id: DOC.SURRENDERED_BL
  canonical: Surrendered B/L
  category: transport_doc
  lang: en
  aliases:
  - 서렌더
  - 서렌더 비엘
  - SUR
  - SUR B/L
  - 권리포기 선하증권
  authority: 업계 관행 · DCSA
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'DCSA 공식 Shipping Glossary(https://dcsa.org/standards/shipping-glossary) 전문 대조. ''Surrendered'' 항목: ''A transportation document is surrendered once the possession/ownership of the document has been transferred from the customer to the carrier'' 확인.'
- term_id: DOC.ORIGINAL_BL
  canonical: Original B/L
  category: transport_doc
  lang: en
  aliases:
  - 정본
  - 원본
  - 정본 선하증권
  - 원본 비엘
  authority: 업계 관행 · DCSA
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'DCSA 공식 Shipping Glossary(https://dcsa.org/standards/shipping-glossary) 전문 대조. ''Original bill of lading''이 다수 용어 정의문(예: Date of issue, Endorsee 등)에서 정의된 개념으로 재확인되나, 독립 표제 항목은 아니어서 부분 확인.'
- term_id: DOC.SEA_WAYBILL
  canonical: Sea Waybill
  category: transport_doc
  lang: en
  aliases:
  - SWB
  - 해상화물운송장
  - 운송장
  authority: 업계 관행 · DCSA
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'DCSA 공식 Shipping Glossary(https://dcsa.org/standards/shipping-glossary) 전문 대조. ''Sea Waybill'' 항목: ''A separate specific transport document type which is non-negotiable, does not transfer title...'' 확인. ''Express B/L''이 동의어로 별도 등재됨(별칭 후보).'
- term_id: DOC.TELEX_RELEASE
  canonical: Telex Release
  category: transport_doc
  lang: en
  aliases:
  - 텔렉스 릴리스
  - 전신 릴리스
  authority: 업계 관행 · DCSA
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'DCSA 공식 Shipping Glossary(https://dcsa.org/standards/shipping-glossary) 전문 대조. ''Telex release''가 ''Express release (Telex)''의 동의어로 명시됨: ''A message that is sent by the carrier...for the shipment release to a named consignee without the need to show the original B/L.'' DCSA의 공식 표제어는 ''Express release (Telex)''이고 ''Telex release''는 그 이명(異名)으로 텍스트에 등장함 — 개념은 확인, 표제어 차이는 note로 남김.'
- term_id: DOC.MASTER_BL
  canonical: Master B/L
  category: transport_doc
  lang: en
  aliases:
  - 마스터 비엘
  - 선사 선하증권
  authority: 업계 관행 · DCSA
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'DCSA 공식 Shipping Glossary(https://dcsa.org/standards/shipping-glossary) 전문 대조. ''Master B/L'' 항목: ''A Master Bill of Lading (MBL) is a document created by the Carrier...'' 확인.'
- term_id: DOC.HOUSE_BL
  canonical: House B/L
  category: transport_doc
  lang: en
  aliases:
  - NVOCC 선하증권
  - 하우스 비엘
  - 포워더 선하증권
  authority: 업계 관행 · DCSA
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'DCSA 공식 Shipping Glossary(https://dcsa.org/standards/shipping-glossary) 전문 대조. ''House B/L'' 항목: ''A House Bill of Lading (HBL) is a document created by Ocean Transport Intermediary (OTI)...'' 확인.'
- term_id: DOC.THROUGH_BL
  canonical: Through B/L
  category: transport_doc
  lang: en
  aliases:
  - 통선하증권
  - 스루 비엘
  - 통과 선하증권
  authority: 업계 관행
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'DCSA 공식 Shipping Glossary(https://dcsa.org/standards/shipping-glossary) 전문 대조.에 ''Through B/L'' 표제 항목이 없어 authority에서 ''· DCSA''를 제거하고 ''업계 관행''으로 낮췄다. Through B/L 자체는 복합/환적 운송에서 널리 쓰이는 통용 무역 용어다.'
- term_id: DOC.STRAIGHT_BL
  canonical: Straight B/L
  category: transport_doc
  lang: en
  aliases:
  - 스트레이트 비엘
  - 기명식 선하증권
  authority: 업계 관행 · DCSA
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'DCSA 공식 Shipping Glossary(https://dcsa.org/standards/shipping-glossary) 전문 대조. ''Straight B/L'' 항목: ''A non-negotiable bill of lading, with a named consignee...A straight B/L is a title to the goods.'' 확인.'
- term_id: DOC.ORDER_BL
  canonical: Order B/L
  category: transport_doc
  lang: en
  aliases:
  - 지시식 운송서류
  - 오더 비엘
  - 지시식 비엘
  - 지시식 선하증권
  authority: 업계 관행 · DCSA
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'DCSA 공식 Shipping Glossary(https://dcsa.org/standards/shipping-glossary) 전문 대조.에 ''Order B/L'' 독립 항목은 없으나 ''To Order BLs''·''Number of original B/Ls: Mandatory for To Order BLs'' 등 문맥에서 ''To Order'' 개념이 반복 확인됨 — DCSA 정의역은 부분적, 무역 실무 통용 개념으로는 확립됨.'
- term_id: DOC.CLEAN_BL
  canonical: Clean B/L
  category: transport_doc
  lang: en
  aliases:
  - 클린 비엘
  - 무사고 선하증권
  - 무고장 선하증권
  authority: 업계 관행
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'DCSA 공식 Shipping Glossary(https://dcsa.org/standards/shipping-glossary) 전문 대조.에 ''Clean B/L'' 표제 항목이 없어 authority에서 ''· DCSA''를 제거하고 ''업계 관행''으로 낮췄다. ''Clean'' 개념 자체는 UCP 600 Art.27(무사고 운송서류)에 근거하나 이는 ISBP/UCP 영역이라 practice_phrase(PHR.CLEAN_ON_BOARD)와 별개로 여기서는 authority만 하향한다.'
- term_id: DOC.CHARTER_PARTY_BL
  canonical: Charter Party B/L
  category: transport_doc
  lang: en
  aliases:
  - 용선계약 선하증권
  - 차터파티 비엘
  authority: 업계 관행 · UCP 600 Art.22
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'DCSA 공식 Shipping Glossary(https://dcsa.org/standards/shipping-glossary) 전문 대조.에는 없으나, UCP 600 제22조 표제가 정확히 ''Charter Party Bill of Lading''이다(2차 출처로 다수 UCP 600 해설 확인, 예: tradefinance.training 등 — ICC 원문은 유료라 원문 자체는 대조 못 함). DCSA보다 정확한 근거인 UCP 600 조번으로 authority를 교체했다.'
- term_id: DOC.COMBINED_TRANSPORT_BL
  canonical: Combined Transport B/L
  category: transport_doc
  lang: en
  aliases:
  - 복합운송서류
  - 복합 비엘
  - 복합운송 선하증권
  - MULTIMODAL
  authority: 업계 관행
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'DCSA 공식 Shipping Glossary(https://dcsa.org/standards/shipping-glossary) 전문 대조.에 표제 항목이 없어 authority에서 ''· DCSA''를 제거하고 ''업계 관행''으로 낮췄다. ''Combined B/L''·''multimodal B/L''은 DCSA 용어집에 다른 항목(예: Merge B/L 정의문) 속에서 언급되나 독립 정의가 아니다.'
- term_id: DLV.DELIVERY_ORDER
  canonical: Delivery Order
  category: delivery
  lang: en
  aliases:
  - D/O
  - DO
  - 인도지시서
  - 인도지시
  authority: 업계 관행
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: '업계 통용 무역/물류 문서(D/O)로 널리 확립된 개념 — 화주·포워더가 터미널/CFS에 화물 인도를 지시하는 표준 서류. authority ''업계 관행'' 표기가 적절함을 확인.'
- term_id: DLV.ARRIVAL_NOTICE
  canonical: Arrival Notice
  category: delivery
  lang: en
  aliases:
  - A/N
  - 도착통지
  - 도착통지서
  - 도착통보
  - 화물 도착 통지
  authority: 업계 관행
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'DCSA 공식 Shipping Glossary(https://dcsa.org/standards/shipping-glossary) 전문 대조. ''Arrival notice'' 항목: ''Notification sent by the publisher ...informing them that a shipment is scheduled to arrive...'' 확인. authority 표기(''업계 관행'')는 이미 적절하여 변경하지 않음.'
- term_id: DLV.CARGO_RELEASE_ORDER
  canonical: Cargo Release Order
  category: delivery
  lang: en
  aliases:
  - CRO
  - 화물인도지시
  authority: 업계 관행
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'DCSA 공식 Shipping Glossary(https://dcsa.org/standards/shipping-glossary) 전문 대조.에 ''Cargo Release Order'' 독립 항목은 없으나 ''Cargo Release Reference number''(터미널 화물 인출 시 제시하는 참조번호) 문맥에서 ''Cargo Release'' 개념이 확인됨 — 업계 통용 문서로서의 실재는 확인, DCSA 표제어와 완전히 일치하지는 않음.'
- term_id: DLV.EQUIPMENT_INTERCHANGE_RECEIPT
  canonical: Equipment Interchange Receipt
  category: delivery
  lang: en
  aliases:
  - EIR
  - 기기인수도증
  authority: 업계 관행
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: '컨테이너 터미널 실무에서 보편적으로 쓰이는 표준 서류(EIR, 기기 인수도 시 상태를 기록) — authority ''업계 관행'' 표기가 적절함을 확인.'
- term_id: DLV.DEVANNING_REPORT
  canonical: Devanning Report
  category: delivery
  lang: en
  aliases:
  - 디배닝 리포트
  - 적출보고서
  authority: 업계 관행
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: 'CFS(컨테이너 화물 집화장) 적출 작업 시 작성되는 업계 통용 서류로 확인 — authority ''업계 관행'' 표기가 적절함.'
- term_id: DLV.CARGO_MANIFEST
  canonical: Cargo Manifest
  category: delivery
  lang: en
  aliases:
  - 화물목록
  - 화물 매니페스트
  - 적하목록
  authority: 업계 관행
  version: std-2026.1
  effective_date: '2026-01-01'
  verified: true
  note: '선박 적하목록으로, 각국 세관 신고 의무와 결부된 보편적 통용 서류 — authority ''업계 관행'' 표기가 적절함을 확인.'
