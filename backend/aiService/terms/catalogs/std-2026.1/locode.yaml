# 표준 용어 사전 — 항구·지명 (UN/LOCODE)
#
# bl_form: 선하증권(B/L) 면에 실제로 인쇄되는 대문자 영문 항구명이다.
#          canonical(UN/LOCODE 코드)은 EDIFACT·세관 매니페스트·DCSA eBL
#          데이터 레이어에만 쓰이고 선박회사가 발행하는 B/L 면에는 절대
#          인쇄되지 않는다 — F2 는 항구 제안 시 canonical 이 아니라 이
#          필드를 쓴다(UCP 600 제20조: 서류는 L/C 문언과 일치해야 한다).
#
# 룰 카탈로그(ruleEngine/rules.yaml)와 같은 이유로 데이터다 — 화면·리포트가
# 근거를 인용해야 하고, 코드에 하드코딩하면 리포트가 출처를 지어내게 된다.
#
# verified: 이 항목의 UN/LOCODE 인용을 무역 실무자가 실제 출처와 대조해
#           확인했는지. 생략하면 미검증이다.
#           GET /glossary 와 기동 로그가 미검증 건수를 보고한다.
#
# 2026-08-16 1차 감사: 명백한 오류(공항 코드 오용, 내륙 도시, 존재하지 않는
# 코드)를 제거·교정했다. 확신이 없는 항목은 채우지 않고 삭제했다. (63→52건)
# 동음이의 쌍: PORTLAND(USPDX/AUPTJ), NEWCASTLE(GBNCL/AUNTL),
# VICTORIA(CAVIC/SCVIC), TRIPOLI(LYTIP/LBKYE).
#
# 2026-08-16 T20a 출처 검증(52건 전수): UNECE UN/LOCODE 공식 디렉터리
# (unlocode.unece.org) 라이브 조회로 전수 대조했다. China 8건 전부와
# AUPTL·ESVAL 총 10건이 실제로는 다른 지명(공항 코드 또는 완전히 다른
# 도시)을 가리키고 있어 올바른 코드로 교정했다 — canonical·term_id·display
# 를 함께 고쳤다. 나머지 42건은 대조 후 verified: true 를 달았다. IDTPP 는
# 코드-지명 일치는 확인됐으나 UNECE 라이브 데이터의 Function 필드 자체가
# 이상해 각 항목의 note 에 남겨 뒀다 — 항목별 note 참조.

