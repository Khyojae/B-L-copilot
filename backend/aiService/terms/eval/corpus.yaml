# F2 교정 정밀도 측정용 라벨 코퍼스.
#
# 정밀도는 "틀린 제안을 안 하는가"이므로 **제안해서는 안 되는 입력**이 없으면
# 측정 자체가 성립하지 않는다. 그래서 음성 사례를 절반 가까이 넣는다
# (`docs/ai-service/f2-standard-terms.md` §정밀도를 재현율보다 우선한다).
#
# requires_choice 는 제안으로 세지 않는다 — 판정한 것이 아니라 사용자에게
# 넘긴 것이다. expect_choice 로 따로 라벨한다.
#
# 라벨 종류는 셋뿐이다: expect(교정값) / expect_none(제안 없어야 함) /
# expect_choice(사용자 선택, to_be 는 None 이어야 한다). 하나만 쓴다.
# 부가로 expect_notice 를 쓸 수 있다(선택).
#
# `expect` 의 모든 canonical 값은 `catalogs/std-2026.1/locode.yaml` ·
# `glossary.yaml` 에 실제로 적재된 항목에서만 가져왔다 — 2026-08-16 감사로
# 삭제된 항구(JPHND·USSJC 등)나 카탈로그에 없는 코드는 정답으로 쓰지 않는다.
#
# 자유서식 안의 조각(컨테이너 번호·HS 코드·관행 문구·운송서류 용어·인도
# 용어·상호 접미)은 span 계약에 따라 `expect` 에 **조각의 교정값**만 적는다
# (필드 전체가 아니다).
#
# `lc:` 가 있는 케이스는 L/C 우선 검증(§예외 "L/C 문언 우선")을 겨냥한다.
# `lc_raw_tags:` 는 MT700 태그 dict 로 자유서식(47A 등) 경로를 겨냥한다.
#
# port 클래스 `expect` 는 이제 canonical(UN/LOCODE 코드)이 아니라 `bl_form`
# (B/L 면 항구명)이다 — 코드는 B/L 면에 인쇄되지 않으므로(UCP 600 제20조)
# 더는 "정답"이 아니다. 같은 이유로 원본 값이 이미 그 항구명을 토큰으로
# 담고 있으면(예: "TOKYO, JAPAN") 캐스케이드가 아예 제안을 만들지 않는다
# (`cascade.py:_port_face_already_covers`) — 그런 케이스는 `expect_none` 이다.

