  # ══════════════════════════════════════════════════════════════
  # L/C 문언 우선 — 전부 음성(min 10)
  # ══════════════════════════════════════════════════════════════
  # L/C 가 지정한 필드는 값이 있기만 하면 사전 기반 교정(①②③④⑤)을 전부
  # 끈다. 아래 값은 전부 이미 정리된 표기(공백 문제 없음)라 ⓪format 마저도
  # 발동하지 않는다 — 순수하게 "사전 교정이 억제되는가"만 겨냥한다.

  - id: LC001
    doc: 선하증권
    field: port_of_loading
    value: "부산"
    lc:
      port_of_loading: "부산"
    class: port
    expect_none: true
    expect_notice: lc_wording
    note: L/C 44E 고정 — 한글 항구명이라도 KRPUS 로 교정하지 않음

  - id: LC002
    doc: 선하증권
    field: port_of_discharge
    value: "LOS ANGELES"
    lc:
      port_of_discharge: "LOS ANGELES"
    class: port
    expect_none: true
    expect_notice: lc_wording
    note: L/C 44F 고정 — USLAX 로 교정하지 않음

  - id: LC003
    doc: 선하증권
    field: consignee
    value: "ABC TRADING CO.,LTD"
    lc:
      consignee: "ABC TRADING CO.,LTD"
    class: party_suffix
    expect_none: true
    expect_notice: lc_wording
    note: L/C consignee 고정 — 접미 표준화(Co., Ltd.)도 억제됨

  - id: LC004
    doc: 상업송장
    field: description_of_goods
    value: "shipped on board vessel per contract"
    lc:
      description_of_goods: "shipped on board vessel per contract"
    class: practice_phrase
    expect_none: true
    expect_notice: lc_wording
    note: L/C 45A 고정 — 관행 문구 교정도 억제됨(L/C 없으면 SHIPPED ON BOARD 로 정상 제안됐을 값)

  - id: LC005
    doc: 상업송장
