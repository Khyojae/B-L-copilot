# 하자 검증 룰 카탈로그 (UCP 600 / ISBP 821)
#
# 기획안 F3 의 "룰엔진(조문 코드화)" 이 이 파일이다. 6.1 아키텍처에서도
# L4 공유 척추의 구성요소로 '룰 카탈로그'가 잡혀 있다.
#
# 룰을 코드가 아닌 데이터로 두는 이유:
#   1. 조문 근거를 화면·리포트가 인용해야 한다. S4 의 '항목별 조문 근거 펼침'과
#      F4 리포트의 ②항목별 리스크가 여기 source 를 그대로 출력한다. 코드에
#      하드코딩하면 리포트가 조문을 지어내게 된다.
#   2. `validation_rules` 테이블 시드로 옮겨간다.
#   3. 룰 추가·심각도 조정에 코드 변경이 필요 없다.
#
# check  : checks.py 에 등록된 함수 이름. 새 검사 유형은 거기 추가한다.
# weight : 하자 확률 기여도. Verdict.defect_probability 가 이 값들을 합산한다.
#          치명 0.30~0.40 / 경고 0.08~0.15 / 참고 0.02 대역을 쓴다.
#          치명 3건이면 1.0 에 닿도록 잡았다.
# message: {bl} {lc} {detail} 이 실행 시 치환된다.

version: 1

rules:
  # ── 필수 항목 누락 ────────────────────────────────────────────
  - id: D001
    title: B/L 번호 누락
    severity: critical
    weight: 0.30
    fields: [bl_no]
    check: required
    source: UCP 600 Art.20(a) — 선하증권은 운송인의 명칭을 표시하고 발행 사실이 특정되어야 한다.
    message: B/L 번호가 없습니다.
    remedy: 선사에서 발급받은 B/L 번호를 입력하세요.

  - id: D005
    title: 수하인 누락
    severity: critical
    weight: 0.30
    fields: [consignee]
    check: required
    source: UCP 600 Art.20(a)(ii) — 선하증권은 물품이 지정된 수하인에게 인도되도록 발행되어야 한다.
    message: Consignee 정보가 없습니다.
    remedy: L/C 가 지정한 수하인을 정확히 기재하세요.

  - id: D012
    title: 선적항 누락
    severity: critical
    weight: 0.30
    fields: [port_of_loading]
    check: required
    source: UCP 600 Art.20(a)(iii) — 선하증권은 신용장에 명시된 선적항과 양륙항을 표시해야 한다.
    message: 선적항 정보가 없습니다.
    remedy: L/C 가 지정한 선적항을 기재하세요.

  - id: D012B
    title: 양하항 누락
    severity: critical
    weight: 0.30
    fields: [port_of_discharge]
    check: required
    source: UCP 600 Art.20(a)(iii) — 선하증권은 신용장에 명시된 선적항과 양륙항을 표시해야 한다.
    message: 양하항 정보가 없습니다.
    remedy: L/C 가 지정한 양하항을 기재하세요.

  - id: D009
    title: 송하인 누락
    severity: warning
    weight: 0.10
    fields: [shipper]
    check: required
    source: ISBP 821 A.1 — 서류상 당사자 표시는 신용장 및 타 서류와 저촉되지 않아야 한다.
    message: Shipper 정보가 없습니다.
    remedy: 수출자(송하인) 상호를 기재하세요.

  # `required` → `required_if_lc` 로 바꿨다. 통지처는 다른 필수 항목과 성격이
  # 다르다 — B/L 번호나 수하인은 L/C 와 무관하게 없으면 하자지만, 통지처는
  # **L/C 46A 가 지정했을 때만** 하자다. 지정이 없으면 검사 대상이 아니며,
  # 그 경우 결과는 `passed` 가 아니라 `not_evaluated` 다.
  #
  # 조건을 붙였으므로 severity 를 critical 로 올릴 수 있다. 이전에는 조건
  # 없이 전건에 걸리는 룰이라 warning 이 아니면 정상 서류를 하자로 만들었다.
  - id: D010
    title: 통지처 누락
    severity: critical
    weight: 0.25
    fields: [notify_party]
    check: required_if_lc
    lc_field: notify_party
    source: UCP 600 Art.14(d) — 서류의 기재는 L/C 조건과 저촉되지 않아야 한다. L/C 가 통지처를 지정한 경우 그 기재가 누락되면 저촉이다.
    message: L/C 가 지정한 Notify Party 가 서류에 없습니다.
    remedy: L/C 46A 의 통지처를 그대로 기재하세요.

  # severity 를 warning → critical 로 올렸다. 판정 기준이 `has_critical` 이라
  # warning 은 검출로 세어지지 않고, 그래서 선박명 누락이 통째로 빠져나갔다
  # (missing_field 재현율의 대부분이 이 한 건이었다).
  #
  # 올리는 근거는 일관성이 아니라 조문이다. Art.20(a)(ii) 는 본선적재를
  # **지정 선박** 에의 적재로 표시할 것을 요구하므로, 선박명이 없으면 선적
  # 사실 자체가 표시되지 않은 것이다. 이는 은행이 거절할 수 있는 하자다.
  # 다른 필수 필드 누락(D001·D005·D012·D012B)이 모두 critical / 0.3 인 것과도
  # 맞는다.
  - id: D011
    title: 선박명 누락
    severity: critical
    weight: 0.3
    fields: [vessel]
    check: required
    source: UCP 600 Art.20(a)(ii) — 선적 사실은 지정 선박에의 본선적재로 표시되어야 한다.
    message: 선박명이 없습니다.
    remedy: 실제 적재 선박명을 기재하세요.

  # ── L/C 조건 불일치 ───────────────────────────────────────────
  - id: D003
    title: 선적항 불일치
    severity: critical
    weight: 0.35
    fields: [port_of_loading]
    check: match_place
    lc_field: port_of_loading
    source: UCP 600 Art.20(a)(iii) — 선하증권상 선적항은 신용장에 명시된 선적항과 일치해야 한다.
    message: 선적항이 L/C 지정 항구와 다릅니다. (서류 {bl} / L/C {lc})
    remedy: L/C 지정 항구 표기로 정정하거나, 실제 선적항이 다르면 L/C 조건변경을 요청하세요.

  - id: D004
    title: 양하항 불일치
    severity: critical
    weight: 0.35
    fields: [port_of_discharge]
    check: match_place
    lc_field: port_of_discharge
    source: UCP 600 Art.20(a)(iii) — 선하증권상 양륙항은 신용장에 명시된 양륙항과 일치해야 한다.
    message: 양하항이 L/C 지정 항구와 다릅니다. (서류 {bl} / L/C {lc})
    remedy: L/C 지정 항구 표기로 정정하거나 L/C 조건변경을 요청하세요.

  - id: D005B
    title: 수하인 불일치
    severity: critical
    weight: 0.35
    fields: [consignee]
    check: match_place
    lc_field: consignee
    source: UCP 600 Art.14(d) — 서류상 정보는 신용장 및 타 서류의 정보와 저촉되어서는 안 된다.
    message: Consignee 가 L/C 지정과 다릅니다. (서류 {bl} / L/C {lc})
    remedy: L/C 가 지정한 수하인 상호를 그대로 기재하세요.

  - id: D006
    title: 화물 명세 불일치
    severity: critical
    weight: 0.35
    fields: [description_of_goods]
    check: contains_keywords
    lc_field: description_of_goods
    source: UCP 600 Art.14(e) — 선하증권상 물품 명세는 신용장의 명세와 저촉되지 않는 일반적 용어로 기재될 수 있다.
    message: 화물 명세에 L/C 요구 키워드가 없습니다. (누락 {detail})
    remedy: L/C 명세의 핵심 용어를 화물 명세에 포함시키세요.

  # ── 기한 ──────────────────────────────────────────────────────
  - id: D002
    title: 선적기한 초과
    severity: critical
    weight: 0.40
    fields: [on_board_date, date_of_issue]
    check: date_not_after
    lc_field: latest_shipment_date
    source: UCP 600 Art.14(c) — 선적일이 신용장에 명시된 최종 선적기일을 경과해서는 안 된다.
    message: 선적일({bl})이 L/C 최종 선적기한({lc})을 넘었습니다.
    remedy: 사후 정정이 불가능한 하자입니다. L/C 조건변경(기한 연장)을 받아야 합니다.

  - id: D008
    title: 유효기간 경과
    severity: critical
    weight: 0.40
    fields: [date_of_issue]
    check: date_not_after
    lc_field: expiry_date
    source: UCP 600 Art.6(d) — 신용장은 제시를 위한 유효기일을 명시해야 하며 그 이후의 제시는 수리되지 않는다.
    message: 발행일({bl})이 L/C 유효기간({lc}) 이후입니다.
    remedy: L/C 유효기간 내 발행분으로 교체하거나 조건변경을 요청하세요.

  - id: D018
    title: 서류제시기간 경과
    severity: critical
    weight: 0.30
    fields: [on_board_date, date_of_issue]
    check: presentation_period
    source: UCP 600 Art.14(c) — 서류는 선적일 후 21일 이내에, 그리고 유효기일 이내에 제시되어야 한다.
    message: 선적일로부터 {detail}일이 지났습니다. 제시기간은 {lc}일입니다.
    remedy: 즉시 은행에 제시하세요. 기간이 지나면 stale B/L 하자가 됩니다.

  # ── 수량·금액 ─────────────────────────────────────────────────
  - id: D007
    title: 중량 한도 초과
    severity: critical
    weight: 0.30
    fields: [gross_weight]
    check: numeric_not_above
    lc_field: max_gross_weight_kg
    unit: KG
    source: UCP 600 Art.30(b) — 물품 수량에 대해 5% 범위의 과부족은 허용되나 신용장 금액을 초과할 수 없다.
    message: 총 중량({bl})이 L/C 허용 한도({lc})를 초과합니다.
    remedy: 실제 중량을 확인하고, 초과가 맞다면 L/C 조건변경을 요청하세요.

  - id: D007B
    title: 용적 한도 초과
    severity: warning
    weight: 0.10
    fields: [measurement]
    check: numeric_not_above
    lc_field: max_measurement_cbm
    unit: CBM
    source: 실무관행 — 용적 초과는 운임 정산 분쟁으로 이어질 수 있다.
    message: 용적({bl})이 L/C 허용 한도({lc})를 초과합니다.
    remedy: 검량 결과를 재확인하세요.

  - id: D017
    title: 운임 허용범위 이탈
    severity: critical
    weight: 0.30
    fields: [total_freight]
    check: within_tolerance
    lc_field: freight_amount
    source: UCP 600 Art.30(a) — 신용장 금액에 about 등이 사용된 경우 10%를 초과하지 않는 과부족이 허용된다.
    message: 운임({bl})이 L/C 허용 범위({lc})를 벗어납니다.
    remedy: 운임 산출 근거를 확인하고 허용 오차 범위 내로 조정하세요.

  # ── 금지 조건 위반 ────────────────────────────────────────────
  - id: D013
    title: 분할선적 금지 위반
    severity: critical
    weight: 0.35
    fields: [description_of_goods]
    check: forbidden_when_prohibited
    lc_flag: partial_shipment
    keywords:
      - PARTIAL SHIPMENT
      - PART SHIPMENT
      - 1ST SHIPMENT
      - 2ND SHIPMENT
      - FIRST SHIPMENT
      - SECOND SHIPMENT
    source: UCP 600 Art.31(a) — 분할선적은 신용장이 금지하지 않는 한 허용된다. 금지된 경우 분할선적 표시는 하자가 된다.
    message: 분할선적 금지 조건인데 분할선적 표시가 있습니다. ({detail})
    remedy: 분할선적 표기를 제거하거나 L/C 조건변경으로 분할선적 허용을 받으세요.

  - id: D014
    title: 환적 금지 위반
    severity: warning
    weight: 0.15
    fields: [description_of_goods, port_of_loading, port_of_discharge]
    check: forbidden_when_prohibited
    lc_flag: transhipment
    keywords:
      - TRANSHIPMENT
      - TRANSSHIPMENT
      - TRANSIT
    source: UCP 600 Art.20(c) — 환적 금지 조건이라도 컨테이너 운송의 경우 환적 표시 선하증권은 수리될 수 있다.
    message: 환적 금지 조건인데 환적 표시가 있습니다. ({detail})
    remedy: 컨테이너 운송이면 Art.20(c) 로 수리 가능합니다. 아니면 직항 선박으로 재선적하세요.

  # ── 참고 항목 ─────────────────────────────────────────────────
  - id: D015
    title: Incoterms 미표시
    severity: warning
    weight: 0.08
    fields: [description_of_goods]
    check: contains_incoterms
    lc_field: incoterms
    source: ISBP 821 A.19 — 신용장이 요구하는 거래조건은 물품 명세에 표시되어야 한다.
    message: L/C 지정 Incoterms({lc})가 화물 명세에 없습니다.
    remedy: 화물 명세에 거래조건을 명시하세요.

  - id: D016
    title: 요구서류 목록에 B/L 없음
    severity: info
    weight: 0.02
    fields: []
    check: bl_in_documents_required
    source: UCP 600 Art.14(a) — 지정은행은 서류만을 근거로 문면상 일치 여부를 심사한다.
    message: L/C 요구 서류 목록에 BILL OF LADING 이 명시되어 있지 않습니다.
    remedy: L/C 원문을 확인하세요. 요구 서류가 아니면 B/L 제시가 불필요할 수 있습니다.
