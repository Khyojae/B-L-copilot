[project]
name = "smart-e-bl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yang6408", email = "redblue6408@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=4.1",
    "cachetools>=5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.9",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
smart-ebl-worker = "smart_e_bl.worker.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
